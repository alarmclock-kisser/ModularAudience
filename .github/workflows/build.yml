name: Build and Release WinForms App Modular Audience

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build --Release
      # Hier bauen wir nur das spezifische Forms-Projekt
      run: dotnet build ModularAudience.Forms/ModularAudience.Forms.csproj --configuration Release --no-restore

    - name: Publish
      run: dotnet publish ModularAudience.Forms/ModularAudience.Forms.csproj -c Release -r win-x64 --self-contained true -o ./publish

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: ./publish/*.exe
        asset_name: ModularAudience_v${{ github.run_number }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
