name: Build WinForms App Modular Audience

on:
  push:
    branches: [ "master" ] # Oder "master"
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest # Wichtig für WinForms (da Windows-abhängig)

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build --Release
      run: dotnet build --configuration Release --no-restore

    - name: Publish
      run: dotnet publish --configuration Release --no-build -o ./publish

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ModularAudience
        path: ./publish/
