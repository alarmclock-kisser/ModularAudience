name: Build and Release WinForms App Modular Audience

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      build_android:
        description: Build and attach the signed Android APK
        type: boolean
        required: false
        default: false

# HIER sind die neuen Berechtigungen hinzugefügt
permissions:
  contents: write

jobs:
  build:
    needs: [android_changes]
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore ModularAudience.Forms/ModularAudience.Forms.csproj

    - name: Build --Release
      run: dotnet build ModularAudience.Forms/ModularAudience.Forms.csproj --configuration Release --no-restore -p:ReleaseNumber=${{ github.run_number }}
    
    - name: Publish
      run: dotnet publish ModularAudience.Forms/ModularAudience.Forms.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfContained=true -p:IncludeNativeLibrariesForSelfExtract=true -p:ReleaseNumber=${{ github.run_number }} -o ./publish

    - name: Package VocalSynth licenses
      run: Compress-Archive -Path .\publish\ThirdPartyLicenses -DestinationPath .\publish\VocalSynthLicenses.zip

    - name: Include the latest Android APK when Android is unchanged
      id: reuse_android_apk
      if: needs.android_changes.outputs.android != 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        mapfile -t release_tags < <(
          gh release list --limit 1000 --json tagName,isDraft \
            --jq '.[] | select(.isDraft == false) | .tagName'
        )
        for tag in "${release_tags[@]}"; do
          [[ "$tag" == release-* ]] || continue
          assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          apk_name="$(printf '%s\n' "$assets" | grep -E '^ModularAudience\.VocalSynth-(Test|Signed)\.apk$' | head -n 1 || true)"
          if [[ -z "$apk_name" ]]; then
            continue
          fi

          gh release download "$tag" --pattern "$apk_name" --dir "./publish"
          apk_variant="${apk_name#ModularAudience.VocalSynth-}"
          apk_variant="${apk_variant%.apk}"
          source_build="${tag#release-}"
          carried_apk="./publish/ModularAudience.VocalSynth-$apk_variant-from-$source_build.apk"
          mv "./publish/$apk_name" "$carried_apk"
          echo "asset=$carried_apk" >> "$GITHUB_OUTPUT"
          echo "Included Android $apk_variant APK from release $tag."
          exit 0
        done

        echo "No previous release with an Android APK was found; Windows release will continue without one."

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ./publish/ModularAudience.Forms.exe
          ./publish/VocalSynthLicenses.zip
        tag_name: release-${{ github.run_number }}
        target_commitish: ${{ github.sha }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Attach carried-forward Android APK
      if: steps.reuse_android_apk.outputs.asset != ''
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: gh release upload "release-${GITHUB_RUN_NUMBER}" "${{ steps.reuse_android_apk.outputs.asset }}" --clobber

  android_changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android || steps.manual.outputs.android }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Detect Android project changes
      id: filter
      if: github.event_name == 'push'
      uses: dorny/paths-filter@v3
      with:
        filters: |
          android:
            - 'ModularAudience.VocalSynth.Android/**'
            - 'ModularAudience.CoOp.Shared/**'
            - 'ModularAudience.CoOp/CoOpDefaults.cs'
            - 'ModularAudience.CoOp/CoOpEndpoint.cs'
            - 'ModularAudience.CoOp/CoOpNetworkUtilities.cs'
            - 'ModularAudience.CoOp/Networking/**'
            - 'ModularAudience.CoOp/Protocol/**'
            - 'ModularAudience.CoOp/Security/**'
            - 'ModularAudience.Audio.VocalCore/**'
            - 'ModularAudience.Audio/Vocal/**'
            - 'ModularAudience.Audio/Processors_V4/Pyin*.cs'
            - 'ModularAudience.slnx'

    - name: Read manual Android build selection
      id: manual
      if: github.event_name == 'workflow_dispatch'
      run: echo "android=${{ inputs.build_android }}" >> "$GITHUB_OUTPUT"

  android:
    needs: [build, android_changes]
    if: needs.android_changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Install Android platform
      run: |
        sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
        sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit)"
        test -n "$sdkmanager" || (echo "Android sdkmanager was not found." >&2; exit 1)
        "$sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

    - name: Install Android workload
      run: dotnet workload install maui-android

    - name: Select APK signing mode
      id: signing
      env:
        ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
        ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      run: |
        if [[ -n "$ANDROID_SIGNING_KEYSTORE_BASE64" \
          && -n "$ANDROID_SIGNING_KEY_ALIAS" \
          && -n "$ANDROID_SIGNING_STORE_PASSWORD" \
          && -n "$ANDROID_SIGNING_KEY_PASSWORD" ]]; then
          echo "enabled=true" >> "$GITHUB_OUTPUT"
        elif [[ -z "$ANDROID_SIGNING_KEYSTORE_BASE64" \
          && -z "$ANDROID_SIGNING_KEY_ALIAS" \
          && -z "$ANDROID_SIGNING_STORE_PASSWORD" \
          && -z "$ANDROID_SIGNING_KEY_PASSWORD" ]]; then
          echo "enabled=false" >> "$GITHUB_OUTPUT"
        else
          echo "Configure all four Android signing secrets, or leave all four unset." >&2
          exit 1
        fi

    - name: Restore and publish APK
      id: publish
      env:
        ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
        ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        APK_SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
      run: |
        apk_suffix=Test
        configuration=Release
        if [[ "$APK_SIGNING_ENABLED" == "true" ]]; then
          key_store="$RUNNER_TEMP/modular-audience-android.keystore"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$key_store"
          key_alias="$ANDROID_SIGNING_KEY_ALIAS"
          store_password="$ANDROID_SIGNING_STORE_PASSWORD"
          key_password="$ANDROID_SIGNING_KEY_PASSWORD"
          apk_suffix=Signed
          configuration=Release
        else
          key_store="$RUNNER_TEMP/modular-audience-debug.keystore"
          key_alias=androiddebugkey
          store_password=android
          key_password=android
          keytool -genkeypair -noprompt \
            -keystore "$key_store" \
            -storetype JKS \
            -storepass "$store_password" \
            -alias "$key_alias" \
            -keypass "$key_password" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=ModularAudience,C=US"
        fi

        dotnet restore ModularAudience.VocalSynth.Android/ModularAudience.VocalSynth.Android.csproj
        dotnet publish ModularAudience.VocalSynth.Android/ModularAudience.VocalSynth.Android.csproj \
          --configuration "$configuration" \
          --framework net10.0-android \
          --output "$RUNNER_TEMP/android-publish" \
          -p:ApplicationVersion=${{ github.run_number }} \
          -p:ApplicationDisplayVersion=1.0.${{ github.run_number }} \
          -p:AndroidPackageFormat=apk \
          -p:EmbedAssembliesIntoApk=true
        apk_path="$(find "$RUNNER_TEMP/android-publish" -type f -name '*.apk' -print -quit)"
        test -n "$apk_path" || (echo "The Android publish did not produce an APK." >&2; exit 1)
        sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
        aapt2="$(find "$sdk_root/build-tools" -type f -name aapt2 -print -quit)"
        test -n "$aapt2" || (echo "Android aapt2 was not found." >&2; exit 1)
        "$aapt2" dump badging "$apk_path" | grep -q "application-icon"
        apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -print -quit)"
        test -n "$apksigner" || (echo "Android apksigner was not found." >&2; exit 1)
        signed_apk="$RUNNER_TEMP/ModularAudience.VocalSynth-$apk_suffix.apk"
        "$apksigner" sign \
          --ks "$key_store" \
          --ks-key-alias "$key_alias" \
          --ks-pass "pass:$store_password" \
          --key-pass "pass:$key_password" \
          --out "$signed_apk" \
          "$apk_path"
        "$apksigner" verify --verbose "$signed_apk"

    - name: Attach APK to release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        apk_suffix=Test
        if [[ "${{ steps.signing.outputs.enabled }}" == "true" ]]; then
          apk_suffix=Signed
        fi
        gh release upload "release-${GITHUB_RUN_NUMBER}" \
          "$RUNNER_TEMP/ModularAudience.VocalSynth-$apk_suffix.apk" --clobber
